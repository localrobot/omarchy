# See the pacman.conf(5) manpage for option and repository directives

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
NoExtract = usr/share/vulkan/icd.d/*nvidia* usr/share/glvnd/egl_vendor.d/*nvidia* usr/lib/libEGL_nvidia* usr/lib/libGLESv2_nvidia* usr/lib/libGLX_nvidia* usr/lib32/libEGL_nvidia* usr/lib32/libGLESv2_nvidia* usr/lib32/libGLX_nvidia*

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here
[omarchy]
Server = https://pkgs.omarchy.org/rc/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
